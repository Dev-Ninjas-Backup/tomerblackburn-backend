services:
  postgres:
    image: postgres:15
    container_name: ${PACKAGE_NAME}_db
    profiles:
      - dev
      - prod
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tomerblackburn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: softvence/${PACKAGE_NAME}:latest
    profiles:
      - prod
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PACKAGE_NAME}_app
    restart: always
    expose:
      - "${PORT}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tomerblackburn-network
    command: sh -c "echo 'Checking Prisma setup...' && ls -la prisma/ && ls -la prisma/migrations/ && echo 'Running migrations...' && npx prisma migrate deploy && echo 'Starting application...' && node dist/src/main"

  frontend:
    image: softvence/${FRONTEND_PACKAGE_NAME}:latest
    profiles:
      - prod
    platform: linux/amd64
    container_name: ${FRONTEND_PACKAGE_NAME}_app
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - tomerblackburn-network

  caddy:
    image: caddy:2-alpine
    container_name: ${PACKAGE_NAME}_caddy
    profiles:
      - prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - frontend
      - prisma-studio
    networks:
      - tomerblackburn-network

  prisma-studio:
    image: softvence/${PACKAGE_NAME}:latest
    profiles:
      - dev
      - prod
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PACKAGE_NAME}_prisma_studio
    restart: always
    expose:
      - "5555"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tomerblackburn-network
    command: npx prisma studio --port 5555 --browser none

networks:
  tomerblackburn-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
